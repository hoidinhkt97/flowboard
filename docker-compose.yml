services:
  agent:
    build:
      context: ./agent
    environment:
      FLOWBOARD_STORAGE: /app/storage
      FLOWBOARD_WS_HOST: "0.0.0.0"
      FLOWBOARD_JWT_SECRET: ${FLOWBOARD_JWT_SECRET:-dev-change-me-in-prod}
    volumes:
      - ./data/storage:/app/storage
      - ./data/codex:/root/.codex
      - ./data/flowboard:/root/.flowboard
    ports:
      - "8101:8101"
      - "127.0.0.1:9223:9223"
    restart: unless-stopped
    networks:
      - flowboard

  frontend:
    build:
      context: ./frontend
    ports:
      - "3000:80"
    depends_on:
      agent:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - flowboard

networks:
  flowboard:
    driver: bridge
